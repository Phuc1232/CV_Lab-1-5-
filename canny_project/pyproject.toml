[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cannylab"
version = "1.0.0"
description = "Canny Edge Detector: tự cài đặt, kiểm chứng, thực nghiệm và đánh giá (mở rộng Lab3)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cannylab = "cannylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: test chậm (hiệu năng, ảnh lớn); bỏ qua bằng -m 'not slow'"]
