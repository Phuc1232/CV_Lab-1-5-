name = "x6_cai_tien"
question = "E2"
description = """
Các biến thể cải thiện Canny: ngưỡng theo nhiễu (Immerkær + hệ số khuếch đại chính xác), phân vị, Otsu,
heuristic median±33% (đối chứng), tiền lọc median / bilateral (đi kèm Otsu, vì sau tiền lọc nhiễu không còn
là nhiễu trắng Gauss nên chiến lược noise mất cơ sở), so với ngưỡng cố định.
"""
seed = 5

[dataset]
source = "synthetic"
family = "shapes"
count = 6
size = 256
degradations = [
  { noise_sigma = 0.05 }, { noise_sigma = 0.15 },
  { salt_pepper = 0.02 }, { salt_pepper = 0.06 },
  { contrast = 0.2, noise_sigma = 0.01 },
]

[[runs]]
label = "co_dinh"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, low_threshold = 0.04, high_threshold = 0.1 }

[[runs]]
label = "nguong_nhieu_pho_quat"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "noise" }

[[runs]]
label = "nguong_nhieu_k"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "noise", k = [3.5, 5.0, 6.0] }

[[runs]]
label = "nguong_nhieu_mac_dinh_cu"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "noise", k = 3.5, ratio = 0.4 }

[[runs]]
label = "phan_vi"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "quantile", low_q = 0.88, high_q = 0.95 }

[[runs]]
label = "otsu"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "otsu" }

[[runs]]
label = "median_33"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "median" }

[[runs]]
label = "tien_loc_median"
algorithm = "canny_manual_fast"
params = { profile = "skimage", prefilter = "median", prefilter_size = [3, 5], sigma = 1.0, threshold_strategy = "otsu" }

[[runs]]
label = "tien_loc_bilateral"
algorithm = "canny_manual_fast"
params = { profile = "skimage", prefilter = "bilateral", prefilter_diameter = 7, prefilter_sigma_color = 0.15, prefilter_sigma_space = 2.0, sigma = 1.0, threshold_strategy = "otsu" }

[evaluation]
metrics = ["edge", "continuity"]
tolerance = 1.5

[figures]
table = ["f1", "precision", "recall", "fom"]
