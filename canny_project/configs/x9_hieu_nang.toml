name = "x9_hieu_nang"
question = "T3a (tốc độ), Manual vs Optimized"
description = """
Thời gian và bộ nhớ theo kích thước ảnh (128² … 1024²), cv2.setNumThreads(0) (chạy tuần tự; trên macOS/GCD giá trị 1 bị bỏ qua) để so sánh công bằng.
Khớp t ∝ N^k trên log–log; kỳ vọng k ≈ 1 vì mọi bước của Canny là O(N).
"""
seed = 8

[dataset]
source = "synthetic"
family = "shapes"
count = 1
sizes = [128, 256, 512, 1024]
degradations = [{ noise_sigma = 0.05 }]

[[runs]]
label = "manual_bfs"
algorithm = "canny_manual"
params = { profile = "skimage", sigma = 1.5, low_threshold = 0.04, high_threshold = 0.1 }

[[runs]]
label = "manual_label"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 1.5, low_threshold = 0.04, high_threshold = 0.1 }

[[runs]]
label = "skimage"
algorithm = "canny_skimage"
params = { sigma = 1.5, low_threshold = 0.04, high_threshold = 0.1 }

[[runs]]
label = "manual_opencv_profile"
algorithm = "canny_manual"
params = { profile = "opencv", low_threshold = 40, high_threshold = 100 }

[[runs]]
label = "opencv"
algorithm = "canny_opencv"
params = { low_threshold = 40, high_threshold = 100 }

[evaluation]
metrics = ["timing"]
timing = { repeats = 5, memory = true, opencv_threads = 0 }

[figures]
best = false
table = ["time_median_s", "time_iqr_s", "mem_peak_tracemalloc_mb", "mem_rss_delta_mb"]
