name = "x1_thu_vien"
question = "P1"
description = """
Canny tự cài (2 hồ sơ) so với cv2.Canny và skimage.feature.canny trên ảnh thật (skimage.data),
và hysteresis BFS so với gán nhãn. Kỳ vọng: n_diff = 0 ở mọi cấu hình (docs/mathematics/05).
"""
seed = 0

[dataset]
source = "skimage"
names = ["camera", "coins", "moon", "page", "astronaut", "grass"]

[[runs]]
label = "manual_opencv_L1"
algorithm = "canny_manual"
params = { profile = "opencv", low_threshold = [50, 100], high_threshold = [150, 200] }
reference = { algorithm = "canny_opencv", drop = ["profile"] }

[[runs]]
label = "manual_opencv_L2"
algorithm = "canny_manual"
params = { profile = "opencv", norm = "L2", low_threshold = 50, high_threshold = [120, 200] }
reference = { algorithm = "canny_opencv", drop = ["profile", "norm"], params = { l2gradient = true } }

[[runs]]
label = "manual_skimage"
algorithm = "canny_manual"
params = { profile = "skimage", sigma = [0.5, 1.0, 2.0, 3.0] }
reference = { algorithm = "canny_skimage", drop = ["profile"] }

[[runs]]
label = "bfs_vs_label"
algorithm = "canny_manual"
params = { profile = "skimage", sigma = 1.5, low_threshold = [10, 20], high_threshold = 40 }
reference = { algorithm = "canny_manual_fast" }

[evaluation]
metrics = ["agreement", "continuity"]

[figures]
best = false
table = ["n_diff", "iou_pixel", "edge_ratio"]
