name = "x2_tham_so"
question = "P2, T2a, T2b"
description = """
Khảo sát từng tham số, giữ cố định phần còn lại (cấu hình cơ sở: sigma=1.5, T_l=0.05, T_h=0.15, thang [0,1]).
sigma_nguong_co_dinh kiểm chứng hệ quả "đỉnh gradient ∝ 1/sigma" (docs/mathematics/01): ngưỡng cố định thì
sigma lớn làm mất cạnh; sigma_nguong_nhieu dùng ngưỡng tỉ lệ với độ lệch chuẩn nhiễu của gradient.
"""
seed = 1

[dataset]
source = "synthetic"
family = "shapes"
count = 6
size = 256
degradations = [{ noise_sigma = 0.05 }, { noise_sigma = 0.15 }]

[[runs]]
label = "sigma_nguong_co_dinh"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = [0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0], low_threshold = 0.05, high_threshold = 0.15 }

[[runs]]
label = "sigma_nguong_nhieu"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = [0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0], threshold_strategy = "noise" }

[[runs]]
label = "nguong_thap"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 1.5, low_threshold = [0.01, 0.02, 0.04, 0.06, 0.09, 0.12, 0.15], high_threshold = 0.15 }

[[runs]]
label = "nguong_cao"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 1.5, low_threshold = 0.04, high_threshold = [0.05, 0.08, 0.12, 0.18, 0.25, 0.35, 0.5] }

[evaluation]
metrics = ["edge", "continuity", "psnr"]
tolerance = 1.5

[figures]
metrics = ["f1", "precision", "recall", "fom", "fragmentation"]
table = ["f1", "precision", "recall", "fom", "fragmentation"]
