name = "x7_mau"
question = "E3"
description = """
Ảnh màu đẳng sáng (hình và nền cùng độ sáng Y): chuyển xám làm mất cạnh. So sánh gray / OR từng kênh /
kênh lớn nhất / Di Zenzo (tự cài) và cv2.Canny 3 kênh. Mỗi phương pháp quét ngưỡng riêng (các độ lớn
khác thang nhau: Di Zenzo cộng năng lượng 3 kênh) và so sánh bằng F1 tốt nhất trên lưới.
"""
seed = 6

[dataset]
source = "synthetic"
family = "isoluminant"
count = 6
size = 128
degradations = [{}, { noise_sigma = 0.03 }]

[[runs]]
label = "gray"
algorithm = "canny_color_manual"
params = { method = "gray", profile = "skimage", sigma = 1.0, low_ratio = 0.4, high_threshold = [0.08, 0.12, 0.18, 0.27, 0.4, 0.6] }

[[runs]]
label = "or"
algorithm = "canny_color_manual"
params = { method = "or", profile = "skimage", sigma = 1.0, low_ratio = 0.4, high_threshold = [0.08, 0.12, 0.18, 0.27, 0.4, 0.6] }

[[runs]]
label = "max_channel"
algorithm = "canny_color_manual"
params = { method = "max_channel", profile = "skimage", sigma = 1.0, low_ratio = 0.4, high_threshold = [0.08, 0.12, 0.18, 0.27, 0.4, 0.6] }

[[runs]]
label = "di_zenzo"
algorithm = "canny_color_manual"
params = { method = "di_zenzo", profile = "skimage", sigma = 1.0, low_ratio = 0.4, high_threshold = [0.08, 0.12, 0.18, 0.27, 0.4, 0.6] }

[[runs]]
label = "opencv_3_kenh"
algorithm = "canny_opencv_color"
params = { low_ratio = 0.4, high_threshold = [40, 60, 90, 135, 200, 300] }

[evaluation]
metrics = ["edge", "continuity"]
tolerance = 1.5

[figures]
table = ["f1", "precision", "recall", "fom"]
