name = "x3_anh_kho"
question = "P3"
description = """
Ba loại ảnh khó: nhiều nhiễu (noise_sigma), tương phản thấp (contrast), nhiều chi tiết (texture).
So sánh tham số mặc định của hai thư viện với cấu hình chỉnh tay và hai chiến lược ngưỡng tự động.
"""
seed = 2

[dataset]
source = "synthetic"
family = "shapes"
count = 6
size = 256
degradations = [
  { noise_sigma = 0.1 }, { noise_sigma = 0.2 },
  { contrast = 0.3, noise_sigma = 0.01 }, { contrast = 0.12, noise_sigma = 0.01 },
  { texture = 0.08 }, { texture = 0.15 },
]

[[runs]]
label = "skimage_mac_dinh"
algorithm = "canny_skimage"
params = {}

[[runs]]
label = "opencv_100_200"
algorithm = "canny_opencv"
params = { low_threshold = 100, high_threshold = 200 }

[[runs]]
label = "chinh_tay_sigma2"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, low_threshold = 0.03, high_threshold = 0.08 }

[[runs]]
label = "tu_dong_nhieu"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "noise" }

[[runs]]
label = "tu_dong_phan_vi"
algorithm = "canny_manual_fast"
params = { profile = "skimage", sigma = 2.0, threshold_strategy = "quantile", low_q = 0.88, high_q = 0.95 }

[evaluation]
metrics = ["edge", "continuity", "psnr"]
tolerance = 1.5

[figures]
table = ["f1", "precision", "recall", "fom", "fragmentation"]
